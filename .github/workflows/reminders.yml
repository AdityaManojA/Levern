name: TaskFlow reminders

# Sends due reminders, priority lead-up reminders and daily nudges as web push notifications. Runs every 5 minutes
# (GitHub may run it a few minutes late). Needs the secrets listed in scripts/reminders/send.mjs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: scripts/reminders
        run: npm install --no-audit --no-fund
      - name: Send due reminders
        working-directory: scripts/reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: node send.mjs

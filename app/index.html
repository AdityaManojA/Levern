<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levern</title>
<meta name="description" content="A calm to-do list that feels like a game.">
<meta name="theme-color" content="#FFF8EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-squircle.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Levern">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script src="js/theme-boot.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/home"><img src="icons/icon-192.png" alt="" width="28" height="28"><span class="brand-t"><span class="brand-n">Levern</span><span class="brand-ph" aria-hidden="true"><i>/</i>lev<b>·</b><em>earn</em><i>/</i></span></span></a>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="nav" id="nav" aria-label="Main"></nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Quest"></section>
<section class="rpanel" id="rpanel" role="dialog" aria-label="Reminders"></section>
<section id="onboard" class="onboard" role="dialog" aria-modal="true" aria-label="Welcome to Levern" hidden></section>
<section id="tour" class="tour" hidden></section>
<dialog id="dialog" class="dialog"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>Levern needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>

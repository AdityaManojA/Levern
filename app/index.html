<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow</title>
<meta name="description" content="A calm to-do list that feels like a game.">
<meta name="theme-color" content="#FFF8EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/home"><img src="icons/icon.svg" alt="" width="28" height="28"><span>TaskFlow</span></a>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="nav" id="nav" aria-label="Main"></nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Quest"></section>
<section class="rpanel" id="rpanel" role="dialog" aria-label="Reminders"></section>
<section id="onboard" class="onboard" role="dialog" aria-modal="true" aria-label="Welcome to TaskFlow" hidden></section>
<section id="tour" class="tour" hidden></section>
<dialog id="dialog" class="dialog"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>TaskFlow needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
